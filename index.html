<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#E5485F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="小周血压本">
<title>小周血压本</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="xz-edition" content="web">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Baloo+2:wght@600;700;800&display=swap">
<style>
/* Layout: one-column phone app — 心心 greeting card on top, big record button, three tabs (今天 / 记录 / 趋势) in a bottom bar. */
:root{
  --bg:#FBF6F7; --surface:#FFFFFF; --sunk:#F4ECEE; --line:#EADDE1;
  --ink:#2B2230; --muted:#76666F;
  --heart:#E5485F; --heart-soft:#FCE3E7; --heart-ink:#FFFFFF;
  --dia:#23897A; --dia-soft:#DDF1EE;
  --ok:#2E8F57; --ok-soft:#E1F3E8;
  --elev:#9A7B12; --elev-soft:#F7F0D4;
  --high:#C9661A; --high-soft:#FBE8D9;
  --crit:#C2362F; --crit-soft:#F9DEDC;
  --low:#3D6FC4; --low-soft:#E1EAF8;
  --shadow:0 6px 24px rgba(120,40,60,.10);
  --f-display:"ZCOOL KuaiLe","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --f-num:"Baloo 2","SF Pro Rounded",ui-rounded,system-ui,sans-serif;
  --f-body:"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1C171B; --surface:#272026; --sunk:#211B20; --line:#3A3038;
  --ink:#F5ECF0; --muted:#B5A5AE;
  --heart:#FF6B80; --heart-soft:#47232B; --heart-ink:#1C171B;
  --dia:#4CC2AF; --dia-soft:#1E3934;
  --ok:#5CC68A; --ok-soft:#1F3828; --elev:#D9BC55; --elev-soft:#3A3218;
  --high:#F0954D; --high-soft:#43301F; --crit:#FF7C73; --crit-soft:#4A2422;
  --low:#7EA6F0; --low-soft:#22304A; --shadow:0 6px 24px rgba(0,0,0,.35);
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#1C171B; --surface:#272026; --sunk:#211B20; --line:#3A3038;
  --ink:#F5ECF0; --muted:#B5A5AE;
  --heart:#FF6B80; --heart-soft:#47232B; --heart-ink:#1C171B;
  --dia:#4CC2AF; --dia-soft:#1E3934;
  --ok:#5CC68A; --ok-soft:#1F3828; --elev:#D9BC55; --elev-soft:#3A3218;
  --high:#F0954D; --high-soft:#43301F; --crit:#FF7C73; --crit-soft:#4A2422;
  --low:#7EA6F0; --low-soft:#22304A; --shadow:0 6px 24px rgba(0,0,0,.35);
  color-scheme:dark;}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:18px;line-height:1.55;-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--heart);outline-offset:2px;border-radius:12px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px calc(110px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand{font-family:var(--f-display);font-size:26px;letter-spacing:.04em;margin:0}
.brand span{color:var(--heart)}
.date{color:var(--muted);font-size:16px}

/* 心心 card */
.guide{display:flex;gap:12px;align-items:flex-end}
.xin{flex:none;width:128px;height:128px;border:0;background:none;padding:0;touch-action:manipulation;position:relative}
.xin::after{content:"";position:absolute;left:18%;right:18%;bottom:0;height:8px;border-radius:50%;background:var(--line);z-index:-1}
.xin img{width:100%;height:100%;object-fit:contain;transform-origin:50% 100%;animation:breathe 3.4s ease-in-out infinite;transition:opacity .18s ease;user-select:none;-webkit-user-select:none}
.xin.swap img{opacity:0}
.xin.hop img{animation:hop .55s ease}
@keyframes breathe{0%,100%{transform:scale(1) rotate(0)}30%{transform:scale(1.02,.985) rotate(-1.2deg)}70%{transform:scale(1.02,.985) rotate(1.2deg)}}
@keyframes hop{0%{transform:translateY(0)}40%{transform:translateY(-16px) scale(1.04)}70%{transform:translateY(2px) scale(1.02,.97)}100%{transform:translateY(0)}}
.bubble{position:relative;flex:1;min-width:0;background:var(--surface);border-radius:22px 22px 22px 6px;padding:14px 16px;box-shadow:var(--shadow);font-size:19px}
.bubble b{font-family:var(--f-display);font-weight:400;color:var(--heart);font-size:20px;display:block;margin-bottom:2px}
.bubble .hint{display:block;color:var(--muted);font-size:14px;margin-top:6px}

/* latest */
.latest{background:var(--surface);border-radius:24px;padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
.label{font-size:15px;color:var(--muted);letter-spacing:.06em}
.reading{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.reading .big{font-size:58px;font-weight:800;line-height:1}
.reading .sys{color:var(--heart)}
.reading .slash{font-size:40px;color:var(--muted);font-weight:600}
.reading .dia{color:var(--dia)}
.reading .unit{font-size:15px;color:var(--muted);margin-left:4px}
.meta{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;color:var(--muted);font-size:16px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;font-size:16px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:9px;height:9px;border-radius:50%;background:currentColor}
.c-ok{color:var(--ok);background:var(--ok-soft)} .c-elev{color:var(--elev);background:var(--elev-soft)}
.c-high{color:var(--high);background:var(--high-soft)} .c-crit{color:var(--crit);background:var(--crit-soft)}
.c-low{color:var(--low);background:var(--low-soft)}
.empty{color:var(--muted);font-size:17px}

.record-btn{border:0;border-radius:26px;background:var(--heart);color:var(--heart-ink);font-family:var(--f-display);font-size:28px;letter-spacing:.1em;padding:22px 16px;box-shadow:0 10px 24px color-mix(in srgb,var(--heart) 35%,transparent);display:flex;align-items:center;justify-content:center;gap:12px;touch-action:manipulation}
.record-btn:active{transform:scale(.98)}
.record-btn svg{width:30px;height:30px}
.record-btn.secondary{background:var(--surface);color:var(--heart);border:3px solid var(--heart-soft);box-shadow:none;font-size:22px;padding:16px}
.scan-box{display:flex;gap:12px;align-items:center;background:var(--surface);border-radius:22px;padding:10px}
.scan-box img{width:96px;height:96px;object-fit:cover;border-radius:14px;flex:none;background:var(--sunk)}
.scan-msg{flex:1;min-width:0;font-size:17px}
.scan-msg .mini{width:40px;height:40px;object-fit:contain;vertical-align:middle;margin-right:4px}
.scan-msg b{display:block;font-family:var(--f-display);font-weight:400;color:var(--heart);font-size:18px}
.scan-box.busy .scan-msg span::after{content:"";display:inline-block;width:1.2em;text-align:left;animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
.field.filled{background:var(--heart-soft)} .field.dia.filled{background:var(--dia-soft)}

.today-list{display:flex;flex-direction:column;gap:10px}
.section-title{font-family:var(--f-display);font-size:21px;margin:4px 0 0}

/* rows */
.day{display:flex;flex-direction:column;gap:8px}
.day h3{margin:8px 0 0;font-size:16px;color:var(--muted);font-weight:600;letter-spacing:.04em}
.row{background:var(--surface);border-radius:18px;padding:12px 14px;display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center;border:0;text-align:left;width:100%}
.row .t{font-size:16px;color:var(--muted);min-width:46px}
.row .v{font-size:30px;font-weight:700;line-height:1.1}
.row .v .s{color:var(--heart)} .row .v .d{color:var(--dia)} .row .v .sl{color:var(--muted);font-weight:600}
.row .sub{grid-column:2 / 4;display:flex;flex-wrap:wrap;gap:6px 12px;font-size:15px;color:var(--muted);min-width:0}
.row .sub .note{color:var(--ink);overflow-wrap:anywhere}
.tag{font-size:14px;padding:2px 9px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.tag.med{background:var(--dia-soft);color:var(--dia)}
.row-actions{grid-column:1 / 4;display:flex;gap:10px;justify-content:flex-end;padding-top:6px}
.btn{border:0;border-radius:14px;padding:10px 16px;font-size:16px;font-weight:600;background:var(--sunk)}
.btn.danger{background:var(--crit-soft);color:var(--crit)}
.btn.primary{background:var(--heart);color:var(--heart-ink)}

/* trend */
.seg{display:flex;background:var(--sunk);border-radius:16px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:none;border-radius:12px;padding:10px 0;font-size:17px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.chart-card{background:var(--surface);border-radius:24px;padding:14px 10px 10px;box-shadow:var(--shadow)}
.chart-card svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:15px;color:var(--muted);padding:6px 8px 0}
.legend i{display:inline-block;width:14px;height:4px;border-radius:2px;vertical-align:middle;margin-right:6px}
.ax{fill:var(--muted);font-size:11px;font-family:var(--f-num)}
.grid{stroke:var(--line);stroke-width:1}
.ref{stroke-width:1.5;stroke-dasharray:5 5}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .k{font-size:14px;color:var(--muted)}
.stat .n{font-size:26px;font-weight:700;line-height:1.15}
.share{display:flex;flex-direction:column;gap:10px;background:var(--surface);border-radius:22px;padding:16px}
.share p{margin:0;color:var(--muted);font-size:15px}
.share .btns{display:flex;gap:10px;flex-wrap:wrap}
.share .btns .btn{flex:1;min-width:140px;padding:14px;font-size:17px}

.notice{font-size:14px;color:var(--muted);background:var(--sunk);border-radius:14px;padding:10px 14px}
.nojs{background:var(--crit-soft);color:var(--crit);border-radius:18px;padding:14px 16px;font-size:17px;max-width:560px;margin:16px auto 0;margin-left:max(16px,env(safe-area-inset-left,0px));margin-right:max(16px,env(safe-area-inset-right,0px))}
.nojs b{display:block;font-size:19px;margin-bottom:4px}
.fine{font-size:13px;color:var(--muted);text-align:center;margin:0}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs .in{display:flex;max-width:560px;width:100%}
.tabs button{flex:1;border:0;background:none;padding:10px 0 12px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:16px;color:var(--muted);font-weight:600}
.tabs svg{width:28px;height:28px}
.tabs button[aria-selected="true"]{color:var(--heart)}

/* sheet */
.sheet{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet .wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 32px;display:flex;flex-direction:column;gap:16px}
.sheet header{display:flex;justify-content:space-between;align-items:center}
.sheet h2{font-family:var(--f-display);font-weight:400;font-size:26px;margin:0}
.close{border:0;background:var(--sunk);border-radius:14px;padding:10px 16px;font-size:17px}
.field{background:var(--surface);border-radius:22px;padding:14px 16px;display:flex;align-items:center;gap:12px;border:3px solid transparent}
.field:focus-within{border-color:var(--heart)}
.field.dia:focus-within{border-color:var(--dia)}
.field label{flex:none;width:92px;font-size:20px;font-weight:700}
.field label small{display:block;font-size:13px;color:var(--muted);font-weight:400}
.field input{flex:1;min-width:0;border:0;background:none;font-family:var(--f-num);font-size:44px;font-weight:700;text-align:right;outline:none;padding:0}
.field input::placeholder{color:var(--line)}
.field .u{flex:none;color:var(--muted);font-size:15px;width:44px}
.field.sys input{color:var(--heart)} .field.dia input{color:var(--dia)}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 16px;font-size:17px}
.chip[aria-pressed="true"]{border-color:var(--dia);background:var(--dia-soft);color:var(--dia);font-weight:700}
.chip.feel[aria-pressed="true"]{border-color:var(--heart);background:var(--heart-soft);color:var(--heart)}
.sub-label{font-size:16px;color:var(--muted);margin:0 0 -6px}
textarea{width:100%;border:2px solid var(--line);background:var(--surface);border-radius:18px;padding:12px 14px;font-size:17px;resize:vertical;min-height:64px}
textarea:focus{outline:none;border-color:var(--heart)}
.when{display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:16px}
.when input{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 10px;font-size:16px;max-width:100%}
.err{color:var(--crit);font-size:16px;min-height:1.4em;margin:0}
.save{border:0;border-radius:24px;background:var(--heart);color:var(--heart-ink);font-family:var(--f-display);font-size:28px;letter-spacing:.2em;padding:18px}

.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:16px;font-size:16px;max-width:calc(100% - 32px);text-align:center}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head>

  <section id="view-home" class="today-list">

<script>
/* 小周血压本 · 本机七段数码管识别（欧姆龙三行屏幕） */
var BPOCR = (function(){
  // 七段：a b c d e f g
  var PATTERNS = [
    ["0","1111110"],["2","1101101"],["3","1111001"],["4","0110011"],["5","1011011"],
    ["6","1011111"],["6","0011111"],["7","1110000"],["7","1110010"],["8","1111111"],
    ["9","1111011"],["9","1110011"],["1","0110000"]
  ];

  function toGray(img, maxSide, deg){
    var w=img.width, h=img.height, s=Math.min(1, maxSide/Math.max(w,h));
    var sw=w*s, sh=h*s, rad=(deg||0)*Math.PI/180;
    var W=Math.round(Math.abs(sw*Math.cos(rad))+Math.abs(sh*Math.sin(rad)));
    var H=Math.round(Math.abs(sw*Math.sin(rad))+Math.abs(sh*Math.cos(rad)));
    var cv=document.createElement("canvas"); cv.width=W; cv.height=H;
    var cx=cv.getContext("2d"); cx.fillStyle="#fff"; cx.fillRect(0,0,W,H);
    cx.translate(W/2,H/2); cx.rotate(rad); cx.drawImage(img,-sw/2,-sh/2,sw,sh);
    var d=cx.getImageData(0,0,W,H).data, g=new Float32Array(W*H), hist=new Int32Array(256);
    for (var i=0,j=0;i<g.length;i++,j+=4){ var v=0.299*d[j]+0.587*d[j+1]+0.114*d[j+2]; g[i]=v; hist[v|0]++; }
    // 亮度拉伸：照片偏暗偏亮都拉到同一范围
    function pct(q){ var t=g.length*q, c=0; for (var k=0;k<256;k++){ c+=hist[k]; if (c>=t) return k; } return 255; }
    var lo=pct(0.02), hi=pct(0.98), sc=hi>lo ? 255/(hi-lo) : 1;
    for (i=0;i<g.length;i++){ var u=(g[i]-lo)*sc; g[i]=u<0?0:u>255?255:u; }
    return {g:g,W:W,H:H};
  }

  // 连通域（4 邻域），返回每个域的外框和面积
  function components(mask, W, H){
    var lab=new Int32Array(W*H), stack=new Int32Array(W*H), out=[], n=0;
    for (var p=0;p<W*H;p++){
      if (!mask[p] || lab[p]) continue;
      n++; var sp=0; stack[sp++]=p; lab[p]=n;
      var x0=W,y0=H,x1=-1,y1=-1,area=0;
      while (sp){
        var q=stack[--sp], x=q%W, y=(q-x)/W; area++;
        if (x<x0)x0=x; if (x>x1)x1=x; if (y<y0)y0=y; if (y>y1)y1=y;
        if (x>0   && mask[q-1] && !lab[q-1]){ lab[q-1]=n; stack[sp++]=q-1; }
        if (x<W-1 && mask[q+1] && !lab[q+1]){ lab[q+1]=n; stack[sp++]=q+1; }
        if (y>0   && mask[q-W] && !lab[q-W]){ lab[q-W]=n; stack[sp++]=q-W; }
        if (y<H-1 && mask[q+W] && !lab[q+W]){ lab[q+W]=n; stack[sp++]=q+W; }
      }
      out.push({id:n,x0:x0,y0:y0,x1:x1,y1:y1,area:area});
    }
    return {lab:lab, comps:out};
  }

  // 1. 找屏幕的深色边框
  function findLCD(G){
    var g=G.g, W=G.W, H=G.H, best=null;
    [70,85,100,55].some(function(T){
      var m=new Uint8Array(W*H); for (var i=0;i<m.length;i++) m[i]=g[i]<T?1:0;
      var CC=components(m,W,H), cs=CC.comps;
      cs.forEach(function(c){
        if (c.x1-c.x0+1<W*0.22 || c.y1-c.y0+1<H*0.15) return;
        // 稳健外框：去掉 1.5% 的离群像素（拍糊时边框会粘到旁边的深色小块）
        var hx=new Int32Array(W), hy=new Int32Array(H);
        for (var y=c.y0;y<=c.y1;y++) for (var x=c.x0;x<=c.x1;x++) if (CC.lab[y*W+x]===c.id){ hx[x]++; hy[y]++; }
        function pct(h,a,b,q){ var t=c.area*q, s=0; for (var i=a;i<=b;i++){ s+=h[i]; if (s>=t) return i; } return b; }
        var rx0=pct(hx,c.x0,c.x1,0.015), rx1=pct(hx,c.x0,c.x1,0.985), ry0=pct(hy,c.y0,c.y1,0.015), ry1=pct(hy,c.y0,c.y1,0.985);
        var w=rx1-rx0+1, h=ry1-ry0+1;
        if (w<W*0.22 || h<H*0.15) return;
        if (rx0<=1 || ry0<=1 || rx1>=W-2 || ry1>=H-2) return;
        c={x0:rx0,y0:ry0,x1:rx1,y1:ry1,area:c.area};
        var ar=h/w; if (ar<0.7 || ar>2.0) return;
        var fill=c.area/(w*h); if (fill>0.6) return;      // 边框是一圈，不是实心块
        // 屏幕外面应该是白色机身，里面是灰色液晶
        var t=Math.max(3,Math.round(w*0.05)), os=0, on=0, is=0, inn=0;
        function add(x,y,inside){ if (x<0||y<0||x>=W||y>=H) return; if (inside){ is+=g[y*W+x]; inn++; } else { os+=g[y*W+x]; on++; } }
        for (var x=c.x0-t; x<=c.x1+t; x+=2){ for (var k=1;k<=t;k+=2){ add(x,c.y0-k,false); add(x,c.y1+k,false); } }
        for (var y=c.y0; y<=c.y1; y+=2){ for (var k=1;k<=t;k+=2){ add(c.x0-k,y,false); add(c.x1+k,y,false); } }
        for (y=Math.round(c.y0+h*0.25); y<c.y1-h*0.25; y+=3) for (x=Math.round(c.x0+w*0.25); x<c.x1-w*0.25; x+=3) add(x,y,true);
        if (!on || !inn) return;
        var outM=os/on, inM=is/inn;
        if (outM<120 || outM<inM+8 || inM<70) return;
        var score=outM - Math.abs(ar-1.15)*40;
        if (!best || score>best.score) best={x:c.x0,y:c.y0,w:w,h:h,score:score};
      });
      return !!best;
    });
    return best;
  }

  // 2. 屏幕内自适应阈值 → 笔画掩膜
  function segMask(G, box){
    var ix=Math.round(box.x+box.w*0.07), iy=Math.round(box.y+box.h*0.05);
    var iw=Math.round(box.w*0.86), ih=Math.round(box.h*0.90);
    var W=G.W, g=G.g;
    var S=new Float64Array((iw+1)*(ih+1));
    for (var y=0;y<ih;y++){ var row=0;
      for (var x=0;x<iw;x++){ row+=g[(iy+y)*W+ix+x]; S[(y+1)*(iw+1)+x+1]=S[y*(iw+1)+x+1]+row; } }
    var r=Math.max(6,Math.round(iw/7)), m=new Uint8Array(iw*ih);
    for (y=0;y<ih;y++) for (x=0;x<iw;x++){
      var xa=Math.max(0,x-r), xb=Math.min(iw,x+r+1), ya=Math.max(0,y-r), yb=Math.min(ih,y+r+1);
      var mean=(S[yb*(iw+1)+xb]-S[ya*(iw+1)+xb]-S[yb*(iw+1)+xa]+S[ya*(iw+1)+xa])/((xb-xa)*(yb-ya));
      var v=g[(iy+y)*W+ix+x];
      m[y*iw+x]=(v<mean-10 && v<mean*0.93)?1:0;
    }
    // 去掉碰到边缘的残留（边框）和很小的噪点
    var cc=components(m,iw,ih), keep={};
    var minA=iw*ih*0.0006;
    cc.comps.forEach(function(c){
      var touch=c.x0===0||c.y0===0||c.x1===iw-1||c.y1===ih-1;
      if (!touch && c.area>=minA) keep[c.id]=1;
    });
    for (var i=0;i<m.length;i++) m[i]=keep[cc.lab[i]]?1:0;
    return {m:m,w:iw,h:ih};
  }

  function bands(profile, minVal){
    var out=[], s=-1;
    for (var i=0;i<=profile.length;i++){
      var on=i<profile.length && profile[i]>minVal;
      if (on && s<0) s=i;
      if (!on && s>=0){ out.push([s,i-1]); s=-1; }
    }
    return out;
  }

  // 3. 切行、切位
  function splitDigits(M){
    var m=M.m, w=M.w, h=M.h, rowP=new Int32Array(h);
    for (var y=0;y<h;y++){ var s=0; for (var x=0;x<w;x++) s+=m[y*w+x]; rowP[y]=s; }
    // 欧姆龙屏幕版式固定：高压在上，低压居中，脉搏在下。在预期位置附近找最空的一行作为分界
    function argminIn(a,b){ var bi=a, bv=1e9; for (var y=Math.round(a);y<=Math.round(b);y++){ if (rowP[y]<bv){ bv=rowP[y]; bi=y; } } return bi; }
    var b1=argminIn(h*0.34,h*0.47), b2=argminIn(h*0.66,h*0.79);
    var spans=[[0,b1],[b1,b2],[b2,h-1]];
    return spans.map(function(sp){
      var y0=sp[0], y1=sp[1];
      while (y0<y1 && !rowP[y0]) y0++; while (y1>y0 && !rowP[y1]) y1--;
      var rh=y1-y0+1, colP=new Int32Array(w);
      for (var x=0;x<w;x++){ var s=0; for (var y=y0;y<=y1;y++) s+=m[y*w+x]; colP[x]=s; }
      var cols=bands(colP, 0);
      var mc=[]; cols.forEach(function(c){
        var l=mc[mc.length-1];
        if (l && c[0]-l[1]-1 < rh*0.06) l[1]=c[1]; else mc.push(c.slice());
      });
      var digits=mc.map(function(c){
        var ty=y1, by=y0;
        for (var y=y0;y<=y1;y++) for (var x=c[0];x<=c[1];x++) if (m[y*w+x]){ if (y<ty)ty=y; if (y>by)by=y; }
        return {x0:c[0],x1:c[1],y0:ty,y1:by};
      }).filter(function(d){ return d.y1-d.y0+1 >= rh*0.6; });
      return {y0:y0,y1:y1,h:rh,digits:digits};
    });
  }

  // 4. 七段判读
  function readDigit(M, d, rowH){
    var w=d.x1-d.x0+1, h=d.y1-d.y0+1;
    if (w < h*0.36) return "1";
    var R={a:[.25,.75,0,.17], b:[.68,1,.12,.45], c:[.68,1,.55,.88], d:[.25,.75,.83,1],
           e:[0,.32,.55,.88], f:[0,.32,.12,.45], g:[.25,.75,.40,.60]};
    // 斜体修正：上半部往右偏
    var slant=0.06*h;
    var fills={}, mx=0;
    "abcdefg".split("").forEach(function(k){
      var r=R[k], on=0, tot=0;
      for (var y=Math.floor(r[2]*h); y<Math.ceil(r[3]*h); y++){
        var off=Math.round(slant*(0.5-y/h));
        for (var x=Math.floor(r[0]*w); x<Math.ceil(r[1]*w); x++){
          var xx=d.x0+x+off, yy=d.y0+y;
          if (xx<0||xx>=M.w) continue;
          tot++; on+=M.m[yy*M.w+xx];
        }
      }
      fills[k]=tot?on/tot:0; if (fills[k]>mx) mx=fills[k];
    });
    var thr=Math.max(0.12, mx*0.4), bits="";
    "abcdefg".split("").forEach(function(k){ bits+= fills[k]>=thr ? "1":"0"; });
    var best=null, bd=9;
    PATTERNS.forEach(function(p){
      var dd=0; for (var i=0;i<7;i++) if (p[1][i]!==bits[i]) dd++;
      if (dd<bd){ bd=dd; best=p[0]; }
    });
    return bd<=1 ? best : "?";
  }

  function plausible(r){
    return r.sys>=60 && r.sys<=260 && r.dia>=30 && r.dia<=160 && r.sys>r.dia+8 && (r.pulse==null || (r.pulse>=30 && r.pulse<=220));
  }
  function readOnce(img, deg){
    var G=toGray(img, 900, deg);
    var box=findLCD(G);
    if (!box) return {ok:false, reason:"没找到血压计屏幕"};
    var M=segMask(G, box);
    var rows=splitDigits(M);
    if (!rows[0].digits.length || !rows[1].digits.length) return {ok:false, reason:"屏幕上的数字没看清"};
    var nums=rows.map(function(r){
      return r.digits.map(function(d){ return readDigit(M,d,r.h); }).join("");
    });
    var sys=/^\d{2,3}$/.test(nums[0])?+nums[0]:null;
    var dia=/^\d{2,3}$/.test(nums[1]||"")?+nums[1]:null;
    var pulse=/^\d{2,3}$/.test(nums[2]||"")?+nums[2]:null;
    var r={sys:sys, dia:dia, pulse:pulse, raw:nums, box:box, deg:deg, M:M, rows:rows};
    r.ok=!!(sys&&dia) && plausible(r);
    return r;
  }
  // 拍歪了也能读：先试正的，再左右各转几度，挑第一个合理的结果（有脉搏的优先）
  function read(img){
    var half=null, last=null, angles=[0,-4,4,-8,8,-12,12];
    for (var i=0;i<angles.length;i++){
      var r=readOnce(img, angles[i]); last=r;
      if (r.ok && r.pulse!=null) return finish(r);
      if (r.ok && !half) half=r;
    }
    return finish(half || {ok:false, reason:(last&&last.reason)||"屏幕上的数字没看清"});
  }
  function finish(r){
    var M=r.M, rows=r.rows;
    var res={ok:!!r.ok, sys:r.ok?r.sys:null, dia:r.ok?r.dia:null, pulse:r.ok?r.pulse:null, raw:r.raw, deg:r.deg, reason:r.reason};
    if (read.debug && M){
      var cv=document.createElement("canvas"); cv.width=M.w; cv.height=M.h; var cx=cv.getContext("2d");
      var id=cx.createImageData(M.w,M.h); for (var i=0;i<M.m.length;i++){ var v=M.m[i]?0:255; id.data[i*4]=v;id.data[i*4+1]=v;id.data[i*4+2]=v;id.data[i*4+3]=255; }
      cx.putImageData(id,0,0); cx.strokeStyle="red";
      rows.forEach(function(r){ r.digits.forEach(function(d){ cx.strokeRect(d.x0,d.y0,d.x1-d.x0+1,d.y1-d.y0+1); }); });
      res.dbg=cv.toDataURL();
    }
    return res;
  }
  return {read:read};
})();

  var DAILY = ["hello","wave","hug","point","drink","cheer","think"];
  function todayPose(){
    var h=new Date().getHours();
    if (h>=22 || h<5) return "lie";
    var d=new Date(), start=new Date(d.getFullYear(),0,0);
    var day=Math.floor((d-start)/864e5);
    return DAILY[day % DAILY.length];
  }
  var curPose=null;
  function setPose(name){
    name = POSES[name] ? name : todayPose();
    var x=$("xin"), img=$("xin-img");
    if (name!==curPose){
      x.classList.add("swap");
      setTimeout(function(){ img.src=POSES[name]; x.classList.remove("swap"); }, curPose?180:0);
      curPose=name;
    }
    x.classList.remove("hop"); void x.offsetWidth; x.classList.add("hop");
  }
  function say(text, pose){
    $("say").textContent = text;
    setPose(pose);
  }
  function defaultSay(){
    if (mode==="loading") return say("我在找你的记录…","think");
    if (!readings.length) return say(greeting()+"我是心心。测完血压，点“拍一下血压计”，我帮你把数字读出来！", "wave");
    var today = readings.filter(function(r){ return dayKey(r.t)===dayKey(Date.now()); });
    var h = new Date().getHours();
    var am = today.some(function(r){ return new Date(r.t).getHours()<12; });
    var pm = today.some(function(r){ return new Date(r.t).getHours()>=12; });
    if (!today.length) return say(greeting()+"今天还没测血压哦，测完记一下吧。");
    if (am && !pm && h>=17) return say(greeting()+"早上测过啦，睡前记得再测一次。");
    if (am && pm) return say(greeting()+"今天早晚都测了，太棒了！","cheer");
    say(greeting()+"今天已经记了 "+today.length+" 次，真认真！");
  }
  $("xin").addEventListener("click", function(){
    say("小贴士："+TIPS[tipIdx % TIPS.length], "point"); tipIdx++;
  });

  /* ---------- 渲染 ---------- */
  function sorted(){ return readings.slice().sort(function(a,b){ return b.t-a.t; }); }
  function medText(m){ return m==="taken"?"已吃药":m==="not"?"未吃药":m==="none"?"不用吃药":""; }

  function rowHTML(r){
    var c=CAT[classify(r.sys,r.dia)], open=openRow===r.id;
    var sub=[];
    sub.push('<span class="pill '+c.cls+'">'+c.label+'</span>');
    if (r.pulse) sub.push('<span>心率 <span class="num">'+r.pulse+'</span></span>');
    if (r.med && r.med!=="none") sub.push('<span class="tag'+(r.med==="taken"?" med":"")+'">'+medText(r.med)+'</span>');
    (r.feel||[]).forEach(function(f){ sub.push('<span class="tag">'+esc(f)+'</span>'); });
    if (r.note) sub.push('<span class="note">'+esc(r.note)+'</span>');
    var actions = open ? '<div class="row-actions">'+
      (confirmDel===r.id
        ? '<span style="align-self:center;font-size:15px;color:var(--muted)">确定删除这条吗？</span><button class="btn" data-act="keep">不删了</button><button class="btn danger" data-act="del" data-id="'+r.id+'">删除</button>'
        : '<button class="btn danger" data-act="ask" data-id="'+r.id+'">删除这条</button>')
      +'</div>' : '';
    return '<div class="row" data-row="'+r.id+'" role="button" tabindex="0" aria-expanded="'+open+'">'+
      '<span class="t num">'+hm(r.t)+'</span>'+
      '<span class="v num"><span class="s">'+r.sys+'</span><span class="sl">/</span><span class="d">'+r.dia+'</span></span>'+
      '<span></span>'+
      '<div class="sub">'+sub.join("")+'</div>'+actions+'</div>';
  }

  function renderLatest(){
    var el=$("latest");
    if (mode==="loading"){ el.innerHTML='<span class="label">最近一次</span><span class="empty">正在读取记录…</span>'; return; }
    var s=sorted();
    if (!s.length){
      el.innerHTML='<span class="label">最近一次</span><span class="empty">还没有记录。测好血压后，点下面的“记一次血压”，把血压计上的两个数字填进去就好。</span>';
      return;
    }
    var r=s[0], c=CAT[classify(r.sys,r.dia)];

  function inRange(){
    var from = Date.now() - range*864e5;
    return readings.filter(function(r){ return r.t>=from; }).sort(function(a,b){ return a.t-b.t; });
  }

  function renderChart(){
    var data=inRange(), el=$("chart");
    var W=360,H=230,L=34,R=10,T=12,B=28, ymin=50, ymax=200;
    var maxV = Math.max.apply(null,[180].concat(data.map(function(r){return r.sys;})));
    var minV = Math.min.apply(null,[60].concat(data.map(function(r){return r.dia;})));
    ymax = Math.ceil((maxV+10)/10)*10; ymin = Math.floor((minV-10)/10)*10;
    var now=Date.now(), x0=now-range*864e5;
    function X(t){ return L+(t-x0)/(now-x0)*(W-L-R); }
    function Y(v){ return T+(ymax-v)/(ymax-ymin)*(H-T-B); }
    var g='';
    [60,90,120,150,180].forEach(function(v){ if(v>ymin&&v<ymax){ g+='<line class="grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v)+'" y2="'+Y(v)+'"/><text class="ax" x="'+(L-6)+'" y="'+(Y(v)+4)+'" text-anchor="end">'+v+'</text>'; } });
    g+='<line class="ref" stroke="var(--heart)" x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(135)+'" y2="'+Y(135)+'"/><text class="ax" x="'+(W-R)+'" y="'+(Y(135)-4)+'" text-anchor="end" style="fill:var(--heart)">135</text>';
    g+='<line class="ref" stroke="var(--dia)" x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(85)+'" y2="'+Y(85)+'"/><text class="ax" x="'+(W-R)+'" y="'+(Y(85)-4)+'" text-anchor="end" style="fill:var(--dia)">85</text>';
    // x ticks
    var ticks = range===7 ? 7 : range===30 ? 6 : 6;
    for (var i=0;i<=ticks;i++){
      var tt = x0 + (now-x0)*i/ticks, d=new Date(tt);
      if (i===ticks) continue;
      g+='<text class="ax" x="'+X(tt)+'" y="'+(H-8)+'" text-anchor="'+(i===0?"start":"middle")+'">'+(d.getMonth()+1)+'/'+d.getDate()+'</text>';
    }
    if (!data.length){
      g+='<text x="'+((W+L)/2)+'" y="'+(H/2)+'" text-anchor="middle" style="fill:var(--muted);font-size:14px">这段时间还没有记录</text>';
    } else {
      function line(key,color){
        var pts=data.map(function(r){ return X(r.t).toFixed(1)+","+Y(r[key]).toFixed(1); });
        var out = data.length>1 ? '<polyline points="'+pts.join(" ")+'" fill="none" stroke="'+color+'" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>' : '';
        data.forEach(function(r,idx){
          var last = idx===data.length-1;
          out+='<circle cx="'+X(r.t).toFixed(1)+'" cy="'+Y(r[key]).toFixed(1)+'" r="'+(last?5:3.2)+'" fill="'+(last?color:"var(--surface)")+'" stroke="'+color+'" stroke-width="2"/>';
        });
        return out;
      }
      g+=line("sys","var(--heart)")+line("dia","var(--dia)");
    }
    el.innerHTML='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="近'+range+'天血压折线图">'+g+'</svg>';

    var st=$("stats");
    if (!data.length){ st.innerHTML=''; return; }
    var avgS=Math.round(data.reduce(function(a,r){return a+r.sys;},0)/data.length);
    var avgD=Math.round(data.reduce(function(a,r){return a+r.dia;},0)/data.length);
    var hi=data.filter(function(r){ var k=classify(r.sys,r.dia); return k==="high"||k==="crit"; }).length;
    st.innerHTML=
      '<div class="stat"><span class="k">平均血压</span><span class="n num"><span style="color:var(--heart)">'+avgS+'</span>/<span style="color:var(--dia)">'+avgD+'</span></span></div>'+
      '<div class="stat"><span class="k">记录次数</span><span class="n num">'+data.length+'</span></div>'+
      '<div class="stat"><span class="k">偏高次数</span><span class="n num" style="color:'+(hi?"var(--high)":"var(--ok)")+'">'+hi+'</span></div>';
  }

  function loadImage(file){

    }

    function viaImg(){ return new Promise(function(res,rej){ var im=new Image(); im.onload=function(){ res(im); }; im.onerror=rej; im.src=scanURL; }); }

  function askClaude(file, ctl){
    return sampler.json(SCAN_PROMPT, {images:[file], signal:ctl.signal}).then(function(res){
      if (scanCtl!==ctl) return; scanCtl=null;
      res = res || {};
      var s=asNum(res.sys,60,260), d=asNum(res.dia,30,160), p=asNum(res.pulse,30,220);
      if (s && d && d>=s){ s=null; d=null; }
      fillFrom(s,d,p);
      if (s && d) setScan("我看到的是 "+s+"/"+d+(p?"，心率 "+p:"")+"。和血压计上的对一下，没错就点下面的“保存”。", false, "point");

    }).catch(function(e){

      if (c==="not_granted" || c==="sampling_disabled" || c==="images_unavailable" || c==="capability_disabled" || c==="capability_removed" || c==="not_declared"){ sampler=null; }
      setScan("这张照片我没看清。可以重拍一张（正对屏幕、别反光），或者直接把数字填进下面。", false);

  /* ---------- 恢复备份（读回导出的表格） ---------- */
  function parseCSV(text){
    var rows=[], row=[], cur="", q=false;
    text=text.replace(/^﻿/,"");
    for (var i=0;i<text.length;i++){
      var c=text[i];
      if (q){ if (c==='"'){ if (text[i+1]==='"'){ cur+='"'; i++; } else q=false; } else cur+=c; }
      else if (c==='"') q=true;
      else if (c===","){ row.push(cur); cur=""; }
      else if (c==="\n"||c==="\r"){ if (c==="\r"&&text[i+1]==="\n") i++; row.push(cur); rows.push(row); row=[]; cur=""; }
      else cur+=c;
    }
    if (cur||row.length){ row.push(cur); rows.push(row); }
    return rows;
  }
  var MED_BACK={"已吃药":"taken","未吃药":"not","不用吃药":"none"};
  $("restore-btn").addEventListener("click", function(){ $("restore-in").value=""; $("restore-in").click(); });
  $("restore-in").addEventListener("change", function(){
    var f=this.files&&this.files[0]; if(!f) return;
    var fr=new FileReader();
    fr.onload=function(){
      var rows=parseCSV(String(fr.result||"")), added=0, seen={};
      readings.forEach(function(r){ seen[r.t+"|"+r.sys+"|"+r.dia]=1; });
      rows.slice(1).forEach(function(c){
        if (c.length<4) return;
        var dm=/^(\d{4})-(\d{2})-(\d{2})$/.exec(c[0]), tm=/^(\d{1,2}):(\d{2})$/.exec(c[1]);
        var sys=+c[2], dia=+c[3];
        if (!dm||!tm||!(sys>=60&&sys<=260)||!(dia>=30&&dia<=160)) return;
        var t=new Date(+dm[1],+dm[2]-1,+dm[3],+tm[1],+tm[2]).getTime();
        var key=t+"|"+sys+"|"+dia; if (seen[key]) return; seen[key]=1;
        readings.push({id:"r"+t.toString(36)+Math.random().toString(36).slice(2,6), t:t, sys:sys, dia:dia,
          pulse:(+c[4]>=30&&+c[4]<=220)?+c[4]:null, med:MED_BACK[c[6]]||null,
          feel:c[7]?c[7].split("、").filter(Boolean):[], note:(c[8]||"").slice(0,200)});
        added++;
      });
      if (!added){ toast("这个文件里没有新的记录"); return; }
      if (!lsSave()){ toast("这台手机的浏览器不让保存"); readings=lsLoad(); return; }
      renderAllViews(); defaultSay(); toast("恢复了 "+added+" 条记录");
    };
    fr.onerror=function(){ toast("这个文件打不开，换一个试试"); };
    fr.readAsText(f,"utf-8");
  });

  var toastTimer=null;
  function toast(msg){ var t=$("toast"); t.textContent=msg; t.hidden=false; clearTimeout(toastTimer); toastTimer=setTimeout(function(){ t.hidden=true; }, 2600); }

  /* ---------- 启动 ---------- */
  renderAllViews(); defaultSay();
  if (HAS_CLAUDE && WEB_EDITION){
    useLocal();
    $("export-csv").hidden=false; $("restore-btn").hidden=false;
    window.claude.use("downloads").then(function(ns){ if (ns) dl=ns; }, function(){});
  } else if (HAS_CLAUDE){
    window.claude.use("db").then(function(ns){ if (ns){ db=ns; startDb(); } else useLocal(); }, useLocal);
    window.claude.use("sample").then(enableScan, function(){});
    window.claude.use("downloads").then(function(ns){ if (ns){ dl=ns; $("export-csv").hidden=false; } }, function(){});
    setTimeout(function(){ if (mode==="loading") useLocal(); }, 11000);
  } else {
    useLocal();
    $("export-csv").hidden=false; $("restore-btn").hidden=false;
  }
  setInterval(function(){ if (mode!=="loading") { renderLatest(); renderToday(); } }, 60000);
})();
</script>
